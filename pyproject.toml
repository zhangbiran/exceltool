[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exceltool"
version = "0.2.0"
description = "AI-friendly CLI for viewing and editing XLS/XLSX workbooks"
requires-python = ">=3.8"

[project.scripts]
exceltool = "exceltool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
